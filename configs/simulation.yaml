# Synthetic data generator configuration.
#
# Every number in this file is a DESIGN ASSUMPTION, not a fact about real fraud.
# The generator is frozen once modelling starts (Phase 6): any change after that must bump
# `simulator_version` and be justified in docs/decisions.md.

simulator_version: "1.0.0"
seed: 42

scales:
  full:
    n_customers: 30000
    n_merchants: 4000
    start: "2024-07-01"
    end: "2026-06-30"
  small:
    n_customers: 2000
    n_merchants: 500
    start: "2025-01-01"
    end: "2025-06-30"
  tiny:
    n_customers: 300
    n_merchants: 120
    start: "2025-01-01"
    end: "2025-02-28"

customers:
  share_created_before_start: 0.80
  max_account_age_years: 8
  activity_sigma: 0.6        # lognormal sigma of the per-customer activity multiplier (mean 1)
  amount_sigma: 0.3          # lognormal sigma of the per-customer spend multiplier (mean 1)
  night_owl_share: 0.05      # customers whose activity peaks ~4h later than usual

cards:
  second_card_prob: 0.35
  second_card_usage: 0.35    # share of transactions on the second card once it exists

devices:
  upgrade_prob: 0.35         # customer replaces their phone during the period (legit new device)
  secondary_prob: 0.45       # customer also uses a desktop or tablet
  secondary_usage: 0.30      # share of e-commerce done from the secondary device
  shared_secondary_prob: 0.04  # secondary device shared with another customer (family)

legit:
  preferred_merchants: 20
  zipf_exponent: 1.1
  explore_prob: 0.12         # transaction at a merchant outside the customer's usual set
  online_preference: 0.6     # down-weights online merchants when building the usual set
  splurge_prob: 0.004        # legit unusually large purchase
  splurge_multiplier: [4.0, 12.0]

fraud:
  target_rate: 0.009         # fraud transactions per legit transaction (before drift)
  scenario_mix:              # share of fraud TRANSACTIONS per scenario (before drift)
    card_testing: 0.25
    account_takeover: 0.25
    card_cloning: 0.15
    fraud_ring: 0.15
    merchant_compromise: 0.10
    stealth: 0.10
  attacker_home_country_prob: 0.40   # attacker appears in the victim's country (VPN, local mule)
  compromised_merchants: 15
  cards_per_ring_device: 25

labels:
  max_delay_days: 120
  delay_sigma: 0.7
  report_prob:
    default: 0.92
    stealth: 0.80
  median_delay_days:
    card_testing: 7
    account_takeover: 14
    card_cloning: 10
    fraud_ring: 25
    merchant_compromise: 21
    stealth: 35
    wallet_provisioning: 12
  card_testing_micro_report_prob: 0.60   # small test charges are often never disputed
  friendly_fraud_rate: 0.0004            # legit transaction disputed as fraud (label noise)
  cleared_dispute_rate: 0.0003           # dispute investigated and confirmed legit

drift:
  start: "2026-03-01"
  online_shift_prob: 0.12            # physical purchases that move online
  wallet_share_physical: 0.25        # mobile wallet share in stores (0.10 before drift)
  amount_inflation: 1.08
  wallet_fraud_incidents_per_10k_customers: 250   # new fraud pattern, ramps up linearly

defects:                             # rates relative to the number of clean transactions
  exact_duplicate: 0.002
  duplicate_id_conflict: 0.0002
  invalid_amount: 0.0005
  invalid_currency: 0.0005
  invalid_timestamp: 0.0003
  missing_customer_id: 0.0002
  orphan_reference: 0.0003
  country_mismatch: 0.0005
  sentinel_device: 0.003
  customer_duplicate: 0.001          # relative to number of customers
  customer_missing_country: 0.001    # relative to number of customers
  card_orphan_customer: 0.0005       # relative to number of cards
